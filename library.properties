sentence=[BETA - Emulator Tested Only] Arduino library for the Analog Devices ADF4159 13 GHz fractional-N frequency synthesizer.
paragraph=Register-level and high-level control of the ADF4159, including frequency programming, sawtooth/triangle/dual/fast/parabolic ramp (FMCW chirp) generation, FSK and PSK modulation, ramp delay/delayed start, interrupt frequency readback, and full status readback. Supports AVR, ESP32, Teensy, STM32, and Raspberry Pi Pico (RP2040), with exact 64-bit integer frequency math for AVR precision and selectable SPI bus per platform. Thoroughly verified using a dual-ESP32 hardware emulation setup.
